repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: backend-mypy
        name: backend mypy
        entry: bash -c 'cd backend && python -m mypy app'
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$
      - id: backend-tests
        name: backend tests
        entry: bash -c 'cd backend && python -m pytest'
        language: system
        pass_filenames: false
        files: ^backend/(app|tests)/.*\.py$
